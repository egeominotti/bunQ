name: Release Binaries

# Build self-contained executables (no Bun install needed on the target) and
# attach them to the GitHub release for the pushed tag. Bun cross-compiles all
# targets from a single Linux runner.
on:
  push:
    tags: ["v*"]

# Pinned (not "latest"): released binaries must be reproducible — the same
# tag rebuilt later must embed the same Bun runtime.
env:
  BUN_VERSION: "1.3.14"

permissions:
  contents: write

jobs:
  binaries:
    name: Build & Upload Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Compile binaries (cross-target)
        run: |
          set -euo pipefail
          mkdir -p dist/release
          declare -A targets=(
            [linux-x64]=bun-linux-x64
            [linux-arm64]=bun-linux-arm64
            [darwin-x64]=bun-darwin-x64
            [darwin-arm64]=bun-darwin-arm64
          )
          for name in "${!targets[@]}"; do
            echo "==> bunqueue-${name}"
            bun build --compile --minify --target="${targets[$name]}" \
              src/main.ts --outfile "dist/release/bunqueue-${name}"
            tar -czf "dist/release/bunqueue-${name}.tar.gz" \
              -C dist/release "bunqueue-${name}"
            rm "dist/release/bunqueue-${name}"
          done

      - name: Checksums
        run: |
          cd dist/release
          sha256sum bunqueue-*.tar.gz > SHA256SUMS

      - name: Smoke test (linux-x64 on this runner)
        run: |
          tar -xzf dist/release/bunqueue-linux-x64.tar.gz -C /tmp
          /tmp/bunqueue-linux-x64 --version

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/bunqueue-*.tar.gz
            dist/release/SHA256SUMS
          generate_release_notes: true
