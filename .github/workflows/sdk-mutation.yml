name: SDK Mutation

# Mutation is intentionally separate from the ordinary release gate: generated
# properties run on every change, while these source-rewriting campaigns run on
# a schedule or on demand and retain their complete reports.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The TypeScript SDK has no mutation job. StrykerJS was removed because its
  # dependency graph was the sole source of the advisories this repository's
  # weekly audit kept reporting (GHSA-q8mj-m7cp-5q26 via typed-rest-client → qs,
  # then GHSA-7p8r-x3mc-p8w7 via ajv → fast-uri), none of which ever reached the
  # published client. The TypeScript planners keep their generated-property
  # coverage in `bun run test:property`; the other five SDKs still mutate the
  # same planner and snapshot-validator surface.
  python:
    name: Python / mutmut
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned mutation and property dependencies
        working-directory: sdk/python
        run: |
          python -m venv .venv-mutation
          .venv-mutation/bin/pip install --quiet -e '.[test,mutation]'
      - name: Mutate flow planners and snapshot validator
        working-directory: sdk/python
        run: |
          set -o pipefail
          .venv-mutation/bin/mutmut run --max-children 4 2>&1 | tee mutmut.log
          .venv-mutation/bin/mutmut export-cicd-stats
          .venv-mutation/bin/python - <<'PY'
          import json
          from pathlib import Path

          stats = json.loads(Path("mutants/mutmut-cicd-stats.json").read_text())
          killed = stats["killed"]
          survived = stats["survived"]
          score = 100.0 * killed / max(1, killed + survived)
          print(f"mutmut mutation score: {score:.2f}% ({killed} killed, {survived} survived)")
          unhealthy = sum(
              stats[key]
              for key in (
                  "no_tests",
                  "suspicious",
                  "timeout",
                  "check_was_interrupted_by_user",
                  "segfault",
              )
          )
          if score < 97.0 or unhealthy:
              raise SystemExit(
                  f"mutation gate failed: score={score:.2f}%, unhealthy={unhealthy}"
              )
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: mutation-python
          path: |
            sdk/python/mutmut.log
            sdk/python/mutants/
          if-no-files-found: ignore

  php:
    name: PHP / Infection
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer
      - name: Install SDK dependencies
        working-directory: sdk/php
        run: composer install --no-interaction --no-progress
      - name: Install pinned Infection PHAR
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/infection/infection/releases/download/0.34.1/infection.phar \
            --output /tmp/infection.phar
          echo '4e8f4235742784f45f2b883a64767a1533c58efcb9f5bd60c62cc6f50fd14035  /tmp/infection.phar' \
            | sha256sum --check
          chmod +x /tmp/infection.phar
      - name: Mutate flow planners and snapshot validator
        working-directory: sdk/php
        run: >-
          php /tmp/infection.phar
          --configuration=infection.json5
          --threads=4
          --min-msi=99
          --min-covered-msi=99
          --no-progress
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: mutation-php
          path: sdk/php/build/
          if-no-files-found: ignore

  go:
    name: Go / Gremlins
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache-dependency-path: sdk/go/go.sum
      # The Go suite's TestMain spawns a real broker with `bun src/main.ts`, so
      # Gremlins cannot even gather baseline coverage without Bun on PATH.
      # Without this the job dies at "server start failed: exec: bun ... not found".
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # The broker imports msgpackr and croner. Without an explicit frozen
      # install it would only start via Bun's implicit auto-install, which is
      # network-dependent and unpinned — the opposite of what CI must do.
      - name: Install pinned broker dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install pinned Gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Mutate flow planners and snapshot validator
        working-directory: sdk/go
        run: |
          set -o pipefail
          mkdir -p build
          gremlins unleash 2>&1 | tee build/gremlins.log
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: mutation-go
          path: sdk/go/build/
          if-no-files-found: ignore

  rust:
    name: Rust / cargo-mutants
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Install latest cargo-mutants compatible with Rust 1.85
        run: cargo install cargo-mutants --version 26.0.0 --locked
      - name: Mutate flow planners and snapshot validator
        working-directory: sdk/rust
        run: |
          set -o pipefail
          cargo mutants 2>&1 | tee cargo-mutants.log
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: mutation-rust
          path: |
            sdk/rust/cargo-mutants.log
            sdk/rust/mutants.out/
          if-no-files-found: ignore

  elixir:
    name: Elixir / Muex
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.1'
          otp-version: '28.0'
      - name: Install pinned dependencies
        working-directory: sdk/elixir
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix deps.compile
      - name: Mutate flow planners and snapshot validator
        working-directory: sdk/elixir
        run: |
          set -o pipefail
          mkdir -p build
          mix mutants 2>&1 | tee build/muex.log
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: mutation-elixir
          path: sdk/elixir/build/muex.log
          if-no-files-found: ignore
