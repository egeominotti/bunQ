[package]
name = "bunqueue-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Official Rust client for the bunqueue job queue server"
license = "MIT"
repository = "https://github.com/egeominotti/bunqueue"
homepage = "https://bunqueue.dev/guide/sdks/"
keywords = ["queue", "jobs", "worker", "bunqueue", "background-jobs"]
categories = ["api-bindings", "network-programming"]

[dependencies]
rmpv = "1.3.1"
rustls = "0.23.42"
rustls-native-certs = "0.8.4"
rustls-pemfile = "2.2.0"
serde_json = "1.0.150"
thiserror = "2.0.18"

[[example]]
name = "conformance-driver"
path = "examples/conformance_driver.rs"
