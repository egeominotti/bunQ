groups:
  - name: bunqueue_alerts
    interval: 30s
    rules:
      # DLQ Alert - Too many jobs in dead letter queue
      - alert: BunqueueDLQHigh
        expr: bunqueue_jobs_dlq > 100
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High number of jobs in DLQ"
          description: "{{ $value }} jobs are in the dead letter queue. Check for systematic failures."

      # Failure Rate Alert
      - alert: BunqueueHighFailureRate
        expr: |
          100 * rate(bunqueue_jobs_failed_total[5m])
          / (rate(bunqueue_jobs_completed_total[5m]) + rate(bunqueue_jobs_failed_total[5m]) + 0.001) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High job failure rate"
          description: "Job failure rate is {{ $value | printf \"%.1f\" }}% over the last 5 minutes."

      # Queue Backlog Alert
      - alert: BunqueueQueueBacklog
        expr: (bunqueue_jobs_waiting + bunqueue_jobs_prioritized) > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Large queue backlog"
          description: "{{ $value }} jobs waiting in queue. Consider scaling workers."

      # No Workers Available
      - alert: BunqueueNoWorkers
        expr: |
          (bunqueue_jobs_waiting + bunqueue_jobs_prioritized) > 0
          and on() bunqueue_workers_active == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No active workers"
          description: "No workers processing jobs while {{ $value }} jobs are waiting."

      # Server Down
      - alert: BunqueueServerDown
        expr: up{job="bunqueue"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Bunqueue server is down"
          description: "Cannot reach Bunqueue server for metrics scraping."

      # Persistent storage cannot currently accept durable work
      - alert: BunqueueStorageDegraded
        expr: bunqueue_storage_degraded == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Bunqueue storage is degraded"
          description: "Persistent storage has reported a write failure."

      # Enabled backups must have a live scheduler
      - alert: BunqueueBackupSchedulerDown
        expr: |
          bunqueue_backup_enabled == 1
          and on() bunqueue_backup_scheduler_running == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Bunqueue backup scheduler is not running"
          description: "S3 backup is enabled but its scheduler is inactive. Check backup configuration and server logs."

      # No successful backup within two configured intervals
      - alert: BunqueueBackupStale
        expr: |
          bunqueue_backup_enabled == 1
          and on() bunqueue_backup_scheduler_running == 1
          and on() (
            (
              bunqueue_backup_last_success_timestamp_seconds == 0
              and on() bunqueue_uptime_seconds > 2 * bunqueue_backup_interval_seconds
            )
            or on() (
              bunqueue_backup_last_success_timestamp_seconds > 0
              and on() (
                time() - bunqueue_backup_last_success_timestamp_seconds
                > 2 * bunqueue_backup_interval_seconds
              )
            )
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Bunqueue backups are stale"
          description: "No successful S3 backup has completed within two configured backup intervals."

      # Any recent failed attempt should be investigated before backups become stale
      - alert: BunqueueBackupFailures
        expr: increase(bunqueue_backup_failures_total[15m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Bunqueue backup attempt failed"
          description: "{{ $value | printf \"%.0f\" }} S3 backup attempts failed in the last 15 minutes."

      # The endpoint is healthy, but per-queue dashboards are intentionally incomplete
      - alert: BunqueueQueueMetricsOmitted
        expr: bunqueue_queue_metrics_omitted > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Bunqueue per-queue metrics are capped"
          description: "{{ $value }} queue names are omitted. Raise METRICS_MAX_QUEUES only after reviewing Prometheus cardinality."

      # Low Throughput (after having traffic)
      - alert: BunqueueLowThroughput
        expr: |
          rate(bunqueue_jobs_completed_total[5m]) < 1
          and on() rate(bunqueue_jobs_pushed_total[5m]) > 1
          and on() (bunqueue_jobs_waiting + bunqueue_jobs_prioritized) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low job completion throughput"
          description: "Job completion rate dropped below 1/s. Check workers and job processing."

      # Worker Utilization High
      - alert: BunqueueWorkerOverload
        expr: |
          100 * bunqueue_worker_active_jobs
          / clamp_min(bunqueue_worker_concurrency_slots, 1) > 95
          and on() bunqueue_worker_concurrency_slots > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Workers near capacity"
          description: "Worker utilization is {{ $value | printf \"%.0f\" }}%. Consider scaling."

      # Jobs Stuck in Active
      - alert: BunqueueJobsStuck
        expr: |
          bunqueue_jobs_active > 100
          and rate(bunqueue_jobs_completed_total[10m]) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Jobs appear stuck"
          description: "{{ $value }} active jobs but no completions in 10 minutes."
