<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="bunqueue, the queue is a file">
  <defs>
    <linearGradient id="tileg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4f9f"/><stop offset="1" stop-color="#d3156d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#db2777" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="300" rx="20" fill="#0e0b13"/>
  <rect width="1000" height="300" rx="20" fill="url(#glow)"/>

  <!-- q tile -->
  <g transform="translate(72,102)">
    <rect width="96" height="96" rx="22" fill="url(#tileg)"/>
    <g transform="translate(16,16) scale(0.6667)">
      <g fill="none" stroke="#fff" stroke-width="4.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="13" y="8" width="20" height="20" rx="6.6"/><path d="M31 26V39.5"/>
      </g>
      <circle cx="31" cy="40" r="4" fill="#fff"/>
    </g>
  </g>

  <!-- wordmark + tagline -->
  <text x="200" y="163" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="800" font-size="78" letter-spacing="-3" fill="#f4eff8">bunqueue</text>
  <text x="203" y="203" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="21" letter-spacing="0.5" fill="#b9adc6">the queue is a file. no redis, no server to run.</text>

  <!-- faint chip-on-a-lane motif -->
  <g opacity="0.9">
    <path d="M735 250 H930" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3" stroke-linecap="round"/>
    <rect x="735" y="243" width="14" height="14" rx="4" fill="#ffffff" opacity="0.16"/>
    <rect x="762" y="243" width="14" height="14" rx="4" fill="#ffffff" opacity="0.28"/>
    <rect x="789" y="242" width="16" height="16" rx="4.5" fill="#ff59a6"/>
  </g>
</svg>
