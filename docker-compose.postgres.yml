services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: bunqueue
      POSTGRES_USER: bunqueue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bunqueue}
    volumes:
      - bunqueue-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bunqueue -d bunqueue']
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  broker-a:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATA_PATH: ''
      BUNQUEUE_STORAGE_DRIVER: postgres
      BUNQUEUE_POSTGRES_URL: ${BUNQUEUE_POSTGRES_URL:-postgres://bunqueue:bunqueue@postgres:5432/bunqueue}
      BUNQUEUE_POSTGRES_NAMESPACE: ${BUNQUEUE_POSTGRES_NAMESPACE:-default}
      BUNQUEUE_BROKER_ID: broker-a
      TCP_PORT: 6789
      HTTP_PORT: 6790
    ports:
      - '${BROKER_A_TCP_PORT:-6789}:6789'
      - '${BROKER_A_HTTP_PORT:-6790}:6790'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  broker-b:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATA_PATH: ''
      BUNQUEUE_STORAGE_DRIVER: postgres
      BUNQUEUE_POSTGRES_URL: ${BUNQUEUE_POSTGRES_URL:-postgres://bunqueue:bunqueue@postgres:5432/bunqueue}
      BUNQUEUE_POSTGRES_NAMESPACE: ${BUNQUEUE_POSTGRES_NAMESPACE:-default}
      BUNQUEUE_BROKER_ID: broker-b
      TCP_PORT: 6789
      HTTP_PORT: 6790
    ports:
      - '${BROKER_B_TCP_PORT:-7789}:6789'
      - '${BROKER_B_HTTP_PORT:-7790}:6790'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bunqueue-postgres-data:
