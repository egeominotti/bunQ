<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="One queue. Any language.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07060a"/>
      <stop offset="0.5" stop-color="#140c18"/>
      <stop offset="1" stop-color="#08060b"/>
    </linearGradient>
    <radialGradient id="pinkAura" cx="70%" cy="44%" r="52%">
      <stop offset="0" stop-color="#ff3f98" stop-opacity="0.3"/>
      <stop offset="0.42" stop-color="#d3156d" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#d3156d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetAura" cx="28%" cy="60%" r="45%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4f9f" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#ff4f9f" stop-opacity="0.9"/>
      <stop offset="0.52" stop-color="#f0abfc"/>
      <stop offset="0.82" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff63ad"/>
      <stop offset="1" stop-color="#d3156d"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#fff" stroke-opacity="0.026" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="strongGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <rect width="1500" height="500" fill="url(#pinkAura)"/>
  <rect width="1500" height="500" fill="url(#violetAura)"/>

  <!-- Perspective queue mesh -->
  <g fill="none" stroke-linecap="round">
    <path d="M-40 88C180 88 232 200 432 200H1068C1268 200 1320 88 1540 88" stroke="#fff" stroke-opacity="0.055"/>
    <path d="M-40 135C190 135 250 218 444 218H1056C1250 218 1310 135 1540 135" stroke="#fff" stroke-opacity="0.075"/>
    <path d="M-40 365C190 365 250 282 444 282H1056C1250 282 1310 365 1540 365" stroke="#fff" stroke-opacity="0.075"/>
    <path d="M-40 412C180 412 232 300 432 300H1068C1268 300 1320 412 1540 412" stroke="#fff" stroke-opacity="0.055"/>
    <path d="M0 250H1500" stroke="url(#beam)" stroke-width="2"/>
  </g>

  <!-- Nodes and jobs -->
  <g>
    <g fill="#fff" opacity="0.14">
      <circle cx="145" cy="135" r="4"/><circle cx="218" cy="164" r="4"/><circle cx="300" cy="197" r="4"/>
      <circle cx="1355" cy="135" r="4"/><circle cx="1282" cy="164" r="4"/><circle cx="1200" cy="197" r="4"/>
      <circle cx="145" cy="365" r="4"/><circle cx="218" cy="336" r="4"/><circle cx="300" cy="303" r="4"/>
      <circle cx="1355" cy="365" r="4"/><circle cx="1282" cy="336" r="4"/><circle cx="1200" cy="303" r="4"/>
    </g>
    <g fill="#ff4f9f">
      <circle cx="386" cy="200" r="5"/>
      <circle cx="1114" cy="300" r="5"/>
    </g>
    <g fill="#a78bfa">
      <circle cx="386" cy="300" r="5"/>
      <circle cx="1114" cy="200" r="5"/>
    </g>
    <circle cx="750" cy="250" r="90" fill="#ff4f9f" opacity="0.1" filter="url(#strongGlow)"/>
    <rect x="720" y="220" width="60" height="60" rx="17" fill="url(#chip)" transform="rotate(45 750 250)"/>
    <rect x="735" y="235" width="30" height="30" rx="9" fill="#fff" fill-opacity="0.92" transform="rotate(45 750 250)"/>
  </g>

  <!-- Directional data packets -->
  <g>
    <rect x="492" y="243" width="18" height="14" rx="4" fill="#ff4f9f"/>
    <rect x="529" y="244" width="16" height="12" rx="4" fill="#ff4f9f" opacity="0.58"/>
    <rect x="563" y="245" width="14" height="10" rx="3" fill="#ff4f9f" opacity="0.3"/>
    <rect x="990" y="243" width="18" height="14" rx="4" fill="#a78bfa"/>
    <rect x="955" y="244" width="16" height="12" rx="4" fill="#a78bfa" opacity="0.58"/>
    <rect x="923" y="245" width="14" height="10" rx="3" fill="#a78bfa" opacity="0.3"/>
  </g>

  <!-- Copy, no logo or wordmark -->
  <g text-anchor="middle">
    <text x="750" y="116" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="62" font-weight="780" letter-spacing="-2" fill="#f8f5fa">One queue. Any language.</text>
    <text x="750" y="405" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="19" letter-spacing="2.4" fill="#bcaec7">ZERO INFRASTRUCTURE  ·  BUILT FOR AI AGENTS</text>
  </g>

  <!-- Edge telemetry -->
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#fff" opacity="0.25">
    <text x="42" y="42">QUEUE://READY</text>
    <text x="1458" y="42" text-anchor="end">WORKERS: ∞</text>
    <text x="42" y="470">PERSISTENCE://SQLITE</text>
    <text x="1458" y="470" text-anchor="end">PROTOCOL://OPEN</text>
  </g>
</svg>
