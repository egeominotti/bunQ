name: SDK Security

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: sdk-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    name: Weekly SDK dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
      - uses: dtolnay/rust-toolchain@stable
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.1'
          otp-version: '28.0'
      - name: TypeScript advisory audit
        working-directory: sdk/typescript
        run: |
          bun install --frozen-lockfile
          bun audit
      - name: Python advisory audit
        run: |
          python -m venv /tmp/python-audit
          /tmp/python-audit/bin/pip install --quiet ./sdk/python pip-audit
          /tmp/python-audit/bin/pip-audit --local
      - name: PHP advisory audit
        working-directory: sdk/php
        run: |
          composer install --no-interaction --no-progress
          composer audit --locked
      - name: Go vulnerability analysis
        working-directory: sdk/go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Rust advisory audit
        working-directory: sdk/rust
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Elixir retired-package audit
        working-directory: sdk/elixir
        run: |
          mix local.hex --force
          mix deps.get
          mix hex.audit
