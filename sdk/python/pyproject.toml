[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bunqueue-client"
version = "0.1.0"
description = "Python client SDK for bunqueue — high-performance job queue server (TCP mode)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Egeo Minotti" }]
keywords = ["queue", "jobs", "worker", "bunqueue", "task-queue"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Distributed Computing",
]
dependencies = ["msgpack>=1.0.0"]

[project.urls]
Homepage = "https://github.com/egeominotti/bunqueue"
Documentation = "https://bunqueue.dev"

[tool.hatch.build.targets.wheel]
packages = ["bunqueue"]
