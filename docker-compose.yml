services:
  bunqueue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bunqueue
    ports:
      - "6789:6789" # TCP Protocol
      - "6790:6790" # HTTP API
    volumes:
      - bunqueue-data:/app/data
    environment:
      - TCP_PORT=6789
      - HTTP_PORT=6790
      - DATA_PATH=/app/data/bunqueue.db
      - NODE_ENV=production
      # Uncomment to enable auth
      # - AUTH_TOKENS=your-secret-token
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:6790/healthz",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: Development with hot reload
  bunqueue-dev:
    image: oven/bun:1.4.2-alpine
    container_name: bunqueue-dev
    working_dir: /app
    ports:
      - "6789:6789"
      - "6790:6790"
    volumes:
      - .:/app
      - /app/node_modules
      - bunqueue-dev-data:/app/data
    environment:
      - TCP_PORT=6789
      - HTTP_PORT=6790
      - DATA_PATH=/app/data/bunqueue.db
      - NODE_ENV=development
    command: bun run dev
    profiles:
      - dev

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: bunqueue-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    restart: unless-stopped
    depends_on:
      - alertmanager
    profiles:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.33.1
    container_name: bunqueue-alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    restart: unless-stopped
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:13.1.0
    container_name: bunqueue-grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-bunqueue}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
    restart: unless-stopped
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  bunqueue-data:
  bunqueue-dev-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
