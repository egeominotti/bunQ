name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      rebuild_docker:
        description: 'Rebuild and publish Docker variants for the current version (main only)'
        type: boolean
        default: false
      npm_version:
        description: 'Exact root bunqueue version to publish to npm (blank disables publishing)'
        type: string
        default: ''

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep local sandbox, CI, and release builds reproducible.
  BUN_VERSION: '1.4.2'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # Code Quality
  # ============================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Oxlint and Oxfmt check
        run: bun run check:oxc

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run type check
        run: bun run typecheck

  # ============================================
  # Tests
  # ============================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build portable client artifacts for parity tests
        run: bun run build:client

      - name: Run unit tests
        run: bun test --parallel=4

  test-postgres:
    name: PostgreSQL ${{ matrix.postgres.label }} Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - label: '18.6'
            image: 'postgres:18.6-alpine'
            expected: '18.6'
          - label: '17.x'
            image: 'postgres:17-alpine'
            expected: '17'
          - label: '16.x'
            image: 'postgres:16-alpine'
            expected: '16'
          - label: '15.x'
            image: 'postgres:15-alpine'
            expected: '15'
    services:
      postgres:
        image: ${{ matrix.postgres.image }}
        env:
          POSTGRES_DB: bunqueue
          POSTGRES_PASSWORD: bunqueue
          POSTGRES_USER: bunqueue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bunqueue -d bunqueue"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      BUNQUEUE_TEST_POSTGRES_URL: postgresql://bunqueue:bunqueue@127.0.0.1:5432/bunqueue
      BUNQUEUE_TEST_POSTGRES_VERSION_PREFIX: ${{ matrix.postgres.expected }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run PostgreSQL integration and four-process topology tests
        run: bun run test:postgres

  test-tcp:
    name: TCP Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run TCP integration tests
        run: bun scripts/tcp/run-all-tests.ts

  test-embedded:
    name: Embedded Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run embedded integration tests
        run: bun scripts/embedded/run-all-tests.ts

  test-core-e2e:
    name: Core Public API E2E (Embedded + TCP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Exercise every core public method against SQLite and a real TCP broker
        run: bun run test:core-e2e

      - name: Upload the method-by-method public API matrix
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-public-api-e2e-matrix
          path: artifacts/core-e2e/
          if-no-files-found: error
          retention-days: 30

  # ============================================
  # Docs site: the bunqueue.dev build must stay green
  # ============================================
  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the sitemap derives real per-page lastmod from git log
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Runs before the build: both failures it catches are invisible locally
      # (an ignored import resolves on the author's disk; a stale generated
      # version list still builds) and its error names the fix directly.
      - name: Check committed docs data
        run: bun scripts/check-docs-data.ts

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build docs site
        working-directory: docs
        run: bun run build

      - name: Sanity-check output
        working-directory: docs
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/rss.xml
          # @astrojs/sitemap emits a single minified line, so `grep -c` (which
          # counts matching LINES) would report 1. Count <loc> OCCURRENCES.
          URLS=$(grep -o "<loc>" dist/sitemap-0.xml | wc -l | tr -d '[:space:]')
          echo "sitemap URLs: $URLS"
          test "$URLS" -ge 60

  test-websocket:
    name: WebSocket/SSE Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run WebSocket/SSE integration tests
        run: bun scripts/websocket/run-all-tests.ts

  # Every release-capable CI run executes the same six-language SDK workflow.
  # Keeping this in the release graph avoids the race where the independent SDK
  # workflow reports a failure only after artifacts have already been published.
  sdk:
    name: Official SDKs
    uses: ./.github/workflows/sdk.yml
    with:
      run_soak: false

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        typecheck,
        test,
        test-postgres,
        test-tcp,
        test-embedded,
        test-core-e2e,
        test-websocket,
        docs,
        sdk,
      ]
    if: ${{ always() }}
    steps:
      - name: Require every test and SDK job
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          POSTGRES_RESULT: ${{ needs.test-postgres.result }}
          TCP_RESULT: ${{ needs.test-tcp.result }}
          EMBEDDED_RESULT: ${{ needs.test-embedded.result }}
          CORE_E2E_RESULT: ${{ needs.test-core-e2e.result }}
          WEBSOCKET_RESULT: ${{ needs.test-websocket.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          SDK_RESULT: ${{ needs.sdk.result }}
        run: |
          set -euo pipefail
          for result in \
            "$LINT_RESULT" "$TYPECHECK_RESULT" "$TEST_RESULT" "$POSTGRES_RESULT" \
            "$TCP_RESULT" "$EMBEDDED_RESULT" "$CORE_E2E_RESULT" "$WEBSOCKET_RESULT" \
            "$DOCS_RESULT" "$SDK_RESULT"; do
            test "$result" = success
          done

  # ============================================
  # Version gate — only build binaries / cut a release when package.json
  # version is NEW (avoids rebuilding 8×~90MB binaries + a fresh release on
  # every docs/chore commit to main, which never bumps the version).
  # ============================================
  version-gate:
    name: Version gate
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: >-
      needs.quality-gate.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.gate.outputs.version }}
      should_release: ${{ steps.gate.outputs.should_release }}
      should_build: ${{ steps.gate.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this version is already released
        id: gate
        env:
          REBUILD_DOCKER: ${{ inputs.rebuild_docker == true || inputs.npm_version != '' }}
          REQUESTED_NPM_VERSION: ${{ inputs.npm_version }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [[ -n "${REQUESTED_NPM_VERSION:-}" && "$REQUESTED_NPM_VERSION" != "$VERSION" ]]; then
            echo "::error::Requested npm version does not match package.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "should_build=$REBUILD_DOCKER" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION already released; Docker rebuild requested: $REBUILD_DOCKER"
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Unable to check release tag (git exited $status)"
              exit "$status"
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is new — building binaries and cutting a release."
          fi

  # ============================================
  # Build Binaries (only on a new version)
  # ============================================
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [version-gate]
    if: needs.version-gate.outputs.should_build == 'true'
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            artifact: bunqueue-linux-x64
          - target: bun-linux-arm64
            artifact: bunqueue-linux-arm64
          - target: bun-linux-x64-musl
            artifact: bunqueue-linux-x64-musl
          - target: bun-linux-arm64-musl
            artifact: bunqueue-linux-arm64-musl
          - target: bun-darwin-x64
            artifact: bunqueue-darwin-x64
          - target: bun-darwin-arm64
            artifact: bunqueue-darwin-arm64
          - target: bun-windows-x64
            artifact: bunqueue-windows-x64.exe
          - target: bun-windows-arm64
            artifact: bunqueue-windows-arm64.exe
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build executable
        run: bun build --compile --minify --target=${{ matrix.target }} src/main.ts --outfile ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  # ============================================
  # Test each production image on native architecture before any publication.
  # ============================================
  docker-test:
    name: Docker test (${{ matrix.variant }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [version-gate, build]
    if: needs.version-gate.outputs.should_build == 'true' && needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, debian, slim, distroless]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: docker/setup-buildx-action@v3
      - name: Build native candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: VARIANT=${{ matrix.variant }}
          load: true
          tags: bunqueue-candidate:${{ matrix.variant }}-${{ matrix.arch }}
          cache-from: type=gha,scope=docker-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.variant }}-${{ matrix.arch }}
      - name: Validate health, authentication, persistence, and cleanup
        run: bun scripts/test-docker-image.ts bunqueue-candidate:${{ matrix.variant }}-${{ matrix.arch }}
      - name: Preserve image validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-evidence-${{ matrix.variant }}-${{ matrix.arch }}
          path: artifacts/docker-images/
          retention-days: 7
      - name: Export tested image
        run: docker save bunqueue-candidate:${{ matrix.variant }}-${{ matrix.arch }} -o /tmp/image-${{ matrix.arch }}.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/image-${{ matrix.arch }}.tar
          compression-level: 0
          retention-days: 1

  docker:
    name: Docker (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: [version-gate, build, docker-test]
    if: >-
      needs.version-gate.outputs.should_build == 'true' &&
      needs.build.result == 'success' && needs.docker-test.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, debian, slim, distroless]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/download-artifact@v4
        with:
          pattern: docker-${{ matrix.variant }}-*
          path: /tmp/docker-images
          merge-multiple: true

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            docker.io/egeominotti/bunqueue
          tags: |
            type=raw,value=${{ needs.version-gate.outputs.version }},enable=${{ matrix.variant == 'alpine' }}
            type=raw,value=latest,enable=${{ matrix.variant == 'alpine' }}
            type=sha,prefix=,enable=${{ matrix.variant == 'alpine' }}
            type=raw,value={{date 'YYYYMMDD-HHmm'}},enable=${{ matrix.variant == 'alpine' }}
            type=raw,value=${{ needs.version-gate.outputs.version }}-${{ matrix.variant }}
            type=raw,value=${{ matrix.variant }}
            type=sha,prefix=,suffix=-${{ matrix.variant }}
            type=raw,value={{date 'YYYYMMDD-HHmm'}}-${{ matrix.variant }}

      - name: Publish the tested images and multi-platform tags
        env:
          VARIANT: ${{ matrix.variant }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker load -i "/tmp/docker-images/image-$arch.tar"
          done
          for registry in "$REGISTRY/$IMAGE_NAME" docker.io/egeominotti/bunqueue; do
            refs=()
            for arch in amd64 arm64; do
              ref="$registry:$GITHUB_SHA-$VARIANT-$arch"
              docker tag "bunqueue-candidate:$VARIANT-$arch" "$ref"
              docker push "$ref"
              refs+=("$ref")
            done
            tags=()
            while IFS= read -r tag; do
              if [[ "$tag" == "$registry:"* ]]; then tags+=(--tag "$tag"); fi
            done <<< "$TAGS"
            test "${#tags[@]}" -gt 0
            docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          done

  # ============================================
  # Root npm package: explicit version request, after all product/image gates.
  # ============================================
  npm:
    name: Publish bunqueue to npm
    runs-on: ubuntu-latest
    needs: [version-gate, build, docker]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.npm_version != '' &&
      github.ref == 'refs/heads/main' && needs.build.result == 'success' &&
      needs.docker.result == 'success'
    permissions:
      contents: read
    env:
      REQUESTED_VERSION: ${{ inputs.npm_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify the explicitly requested unpublished version
        run: |
          set -euo pipefail
          test "$REQUESTED_VERSION" = "$(node -p "require('./package.json').version")"
          bun -e '
            const response = await fetch("https://registry.npmjs.org/bunqueue/" + encodeURIComponent(process.env.REQUESTED_VERSION));
            if (response.status !== 404) throw new Error("Publication blocked: registry returned " + response.status);
          '
      - name: Build and verify the package consumer contract
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun test test/package-consumer-smoke.test.ts
          mkdir -p /tmp/npm-package
          bun pm pack --ignore-scripts --destination /tmp/npm-package
      - name: Verify npm authentication and publication dry run
        run: |
          bun pm whoami
          bun publish --dry-run "/tmp/npm-package/bunqueue-$REQUESTED_VERSION.tgz"
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: npm-bunqueue-${{ inputs.npm_version }}
          path: /tmp/npm-package/*.tgz
          retention-days: 7
      - name: Publish the verified tarball
        run: bun publish --access public "/tmp/npm-package/bunqueue-$REQUESTED_VERSION.tgz"
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ============================================
  # Create Release (only on main)
  # ============================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [version-gate, build, docker]
    # Explicit gate (not just implicit success() propagation from build/docker):
    # only cut a release for a NEW version.
    if: >-
      needs.version-gate.outputs.should_release == 'true' &&
      needs.build.result == 'success' &&
      needs.docker.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "version=${{ needs.version-gate.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: bunqueue-*
          merge-multiple: true

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release
          ls -la artifacts/

          # Collect binaries (artifacts may be nested one level depending on the
          # upload-artifact version), keeping the canonical names.
          for name in bunqueue-linux-x64 bunqueue-linux-arm64 bunqueue-linux-x64-musl bunqueue-linux-arm64-musl bunqueue-darwin-x64 bunqueue-darwin-arm64 bunqueue-windows-x64.exe bunqueue-windows-arm64.exe; do
            cp "artifacts/$name" release/ 2>/dev/null || cp "artifacts/$name/$name" release/
          done

          # Compress each binary before upload: a Bun --compile binary embeds the
          # whole runtime (~60–94MB) but compresses ~55–65%, so the DOWNLOAD drops
          # to ~30–40MB. Unix → .tar.gz (preserves the +x bit), Windows → .zip.
          cd release
          for name in bunqueue-linux-x64 bunqueue-linux-arm64 bunqueue-linux-x64-musl bunqueue-linux-arm64-musl bunqueue-darwin-x64 bunqueue-darwin-arm64; do
            chmod +x "$name"
            tar -czf "$name.tar.gz" "$name"
            rm "$name"
          done
          for name in bunqueue-windows-x64 bunqueue-windows-arm64; do
            zip -9 "$name.zip" "$name.exe"
            rm "$name.exe"
          done

          # Checksums of the published (compressed) artifacts.
          sha256sum bunqueue-* > SHA256SUMS
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/bunqueue-linux-x64.tar.gz
            release/bunqueue-linux-arm64.tar.gz
            release/bunqueue-linux-x64-musl.tar.gz
            release/bunqueue-linux-arm64-musl.tar.gz
            release/bunqueue-darwin-x64.tar.gz
            release/bunqueue-darwin-arm64.tar.gz
            release/bunqueue-windows-x64.zip
            release/bunqueue-windows-arm64.zip
            release/SHA256SUMS
          body: |
            ## Installation

            ### Docker (recommended)

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            docker run -p 6789:6789 -p 6790:6790 ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```

            The immutable version tag and `latest` point to the same multi-arch image.

            ### Binary

            Compressed downloads (~30–40MB; extract to get the standalone
            executable, which embeds the Bun runtime). Verify with `SHA256SUMS`.

            | Platform | Architecture | Download |
            |----------|-------------|----------|
            | Linux | x64 | `bunqueue-linux-x64.tar.gz` |
            | Linux | arm64 | `bunqueue-linux-arm64.tar.gz` |
            | Linux (musl / Alpine) | x64 | `bunqueue-linux-x64-musl.tar.gz` |
            | Linux (musl / Alpine) | arm64 | `bunqueue-linux-arm64-musl.tar.gz` |
            | macOS | x64 (Intel) | `bunqueue-darwin-x64.tar.gz` |
            | macOS | arm64 (Apple Silicon) | `bunqueue-darwin-arm64.tar.gz` |
            | Windows | x64 | `bunqueue-windows-x64.zip` |
            | Windows | arm64 | `bunqueue-windows-arm64.zip` |

            ```bash
            # Example: Linux x64
            tar -xzf bunqueue-linux-x64.tar.gz
            chmod +x bunqueue-linux-x64
            ./bunqueue-linux-x64
            ```
