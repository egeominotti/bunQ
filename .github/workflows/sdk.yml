name: SDK

# Polyglot SDK CI; integration and conformance spawn the current broker.

on:
  workflow_call:
    inputs:
      run_soak:
        description: 'Also run the sustained soak profiles'
        type: boolean
        default: false
  schedule:
    - cron: '0 2 * * 0'
  # The soak steps only ever ran on the weekly schedule, so a fix to them could
  # not be exercised before the next Sunday. Manual dispatch makes them runnable.
  workflow_dispatch:
    inputs:
      run_soak:
        description: 'Also run the sustained soak profiles (adds ~15 min per SDK)'
        type: boolean
        default: false

# Soaks exceed the anti-abuse default on disposable brokers, so the limit and the
# soak gate must be derived from the SAME condition: a manual soak run with the
# push-level limit would measure the throttle instead of the client.
env:
  RUN_SOAK: ${{ github.event_name == 'schedule' || inputs.run_soak }}
  RATE_LIMIT_MAX_REQUESTS: ${{ (github.event_name == 'schedule' || inputs.run_soak) && '1000000' || '10000' }}

jobs:
  typescript:
    name: TypeScript (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    # Bounds a wedge OUTSIDE any test framework — dependency resolution, a
    # broker that never binds, a hung conformance driver — which would
    # otherwise burn the 360-minute runner default. Fits the 15m soak.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node, deno]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x
      - name: Install server deps (for bun src/main.ts)
        run: bun install --frozen-lockfile
      - name: Install + build SDK
        working-directory: sdk/typescript
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Oxlint and Oxfmt check
        working-directory: sdk/typescript
        run: bun run check
      - name: Flow planner properties (fast-check)
        if: matrix.runtime == 'bun'
        working-directory: sdk/typescript
        run: bun run test:property
      - name: Validate package contents
        if: matrix.runtime == 'bun'
        working-directory: sdk/typescript
        run: mkdir -p /tmp/typescript-package && bun pm pack --destination /tmp/typescript-package
      - name: Integration + e2e (bun)
        if: matrix.runtime == 'bun'
        working-directory: sdk/typescript
        run: |
          bun tests/integration.ts
          bun tests/e2e.ts
      - name: Integration + e2e (node)
        if: matrix.runtime == 'node'
        working-directory: sdk/typescript
        run: |
          node --experimental-strip-types tests/integration.ts
          node --experimental-strip-types tests/e2e.ts
      - name: Integration + e2e (deno)
        if: matrix.runtime == 'deno'
        working-directory: sdk/typescript
        run: |
          deno run -A tests/integration.ts
          deno run -A tests/e2e.ts
      - name: Protocol conformance
        if: matrix.runtime == 'bun'
        working-directory: sdk/conformance
        run: bun runner.ts --driver "bun drivers/typescript.ts"
      - name: Cloudflare Workers package e2e
        if: matrix.runtime == 'bun'
        working-directory: sdk/typescript
        env:
          CLOUDFLARE_CF_FETCH_ENABLED: 'false'
          WRANGLER_SEND_METRICS: 'false'
        run: bun run test:workers
      - name: Weekly sustained SDK soak
        if: env.RUN_SOAK == 'true' && matrix.runtime == 'bun'
        working-directory: sdk/typescript
        env:
          BUNQUEUE_SDK_SOAK_SECONDS: '900'
          BUNQUEUE_SDK_SOAK_BATCH: '100'
        run: bun tests/soak.ts

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install server deps (for bun src/main.ts)
        run: bun install --frozen-lockfile
      - name: Set up SDK environment
        working-directory: sdk/python
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet build hatchling
          .venv/bin/pip install --quiet -e '.[test]'
      - name: Flow planner properties (Hypothesis)
        working-directory: sdk/python
        run: .venv/bin/python -m pytest tests/test_flow_plan_property.py -q
      - name: Integration + e2e
        working-directory: sdk/python
        run: |
          .venv/bin/python -m compileall -q bunqueue tests
          .venv/bin/python -m build --no-isolation --outdir /tmp/python-package
          .venv/bin/python tests/test_integration.py
          .venv/bin/python tests/run_e2e.py
      - name: Protocol conformance
        working-directory: sdk/conformance
        run: bun runner.ts --driver "../python/.venv/bin/python drivers/python.py"
      - name: Weekly sustained SDK soak
        if: env.RUN_SOAK == 'true' && matrix.python == '3.13'
        working-directory: sdk/python
        env:
          BUNQUEUE_SDK_SOAK_SECONDS: '900'
          BUNQUEUE_SDK_SOAK_BATCH: '100'
        run: .venv/bin/python tests/soak.py

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - name: Install server dependencies
        run: bun install --frozen-lockfile
      - name: Install SDK dependencies
        working-directory: sdk/php
        run: composer install --no-interaction --no-progress
      - name: Syntax and e2e
        working-directory: sdk/php
        run: |
          composer validate --strict --no-check-publish
          find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
          composer test:property
          php tests/run-e2e.php
      - name: Protocol conformance
        working-directory: sdk/conformance
        run: bun runner.ts --driver "php drivers/php.php"
      - name: Weekly sustained SDK soak
        if: env.RUN_SOAK == 'true' && matrix.php == '8.4'
        working-directory: sdk/php
        env:
          BUNQUEUE_SDK_SOAK_SECONDS: '900'
          BUNQUEUE_SDK_SOAK_BATCH: '100'
        run: php tests/soak.php

  go:
    name: Go 1.26.5
    runs-on: ubuntu-latest
    # Soak (15m) + 60s fuzzing on top of the suite.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache-dependency-path: sdk/go/go.sum
      - name: Install server dependencies
        run: bun install --frozen-lockfile
      - name: Format, vet, and test
        working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go list ./...
          go test -v ./...
          go test -race -run 'Hardening|Regression|Worker' ./...
      - name: Protocol conformance
        working-directory: sdk/conformance
        run: bun runner.ts --driver "go -C drivers/go run ."
      - name: Weekly sustained SDK soak
        if: env.RUN_SOAK == 'true'
        working-directory: sdk/go
        env:
          BUNQUEUE_SDK_SOAK_SECONDS: '900'
          BUNQUEUE_SDK_SOAK_BATCH: '100'
        # `go test` panics at its own 10m default, which is shorter than the soak
        # itself. Derive the bound from the soak length so bumping the duration
        # cannot silently reintroduce the panic; the slack covers broker startup
        # and shutdown. The precondition is load-bearing: with the default
        # `bash -e` (no `set -u`) an unset, renamed or non-numeric variable
        # arithmetically expands to `-timeout 300s` — a bound TIGHTER than the
        # default it replaces, failing exactly like the bug this fixes.
        run: |
          : "${BUNQUEUE_SDK_SOAK_SECONDS:?soak duration must be set}"
          case $BUNQUEUE_SDK_SOAK_SECONDS in
            ''|*[!0-9]*) echo "BUNQUEUE_SDK_SOAK_SECONDS must be integer seconds" >&2; exit 1 ;;
          esac
          go test -run '^TestSDKSoak$' -count=1 \
            -timeout "$((BUNQUEUE_SDK_SOAK_SECONDS + 300))s" -v
      - name: Weekly native fuzzing
        if: env.RUN_SOAK == 'true'
        working-directory: sdk/go
        run: go test -run '^$' -fuzz '^FuzzHardeningPortableWirePayload$' -fuzztime 60s

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Install server dependencies
        run: bun install --frozen-lockfile
      - name: Format, lint, and test
        working-directory: sdk/rust
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo package --locked --allow-dirty --no-verify
      - name: Protocol conformance
        working-directory: sdk/conformance
        run: >-
          bun runner.ts --driver
          "cargo run --locked --quiet --manifest-path ../rust/Cargo.toml --example conformance-driver"
      - name: Weekly sustained SDK soak
        if: env.RUN_SOAK == 'true'
        working-directory: sdk/rust
        env:
          BUNQUEUE_SDK_SOAK_SECONDS: '900'
          BUNQUEUE_SDK_SOAK_BATCH: '100'
        run: cargo test --locked --test soak -- --ignored

  elixir:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.15.8'
            otp: '26.2'
          - elixir: '1.20.1'
            otp: '28.0'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Install server dependencies
        run: bun install --frozen-lockfile
      - name: Install, format, compile, and test
        working-directory: sdk/elixir
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix deps.compile
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test --slowest 20
          mix hex.build
      - name: Protocol conformance
        working-directory: sdk/conformance
        run: bun runner.ts --driver "cd ../elixir && mix run ../conformance/drivers/elixir.exs"
      - name: Weekly sustained SDK soak
        if: env.RUN_SOAK == 'true' && matrix.elixir == '1.20.1'
        working-directory: sdk/elixir
        env:
          BUNQUEUE_SDK_SOAK_SECONDS: '900'
          BUNQUEUE_SDK_SOAK_BATCH: '100'
        # ExUnit kills a test at 60s by default, well under the soak duration.
        # Same derivation and preconditions as the Go soak, in milliseconds.
        run: |
          : "${BUNQUEUE_SDK_SOAK_SECONDS:?soak duration must be set}"
          case $BUNQUEUE_SDK_SOAK_SECONDS in
            ''|*[!0-9]*) echo "BUNQUEUE_SDK_SOAK_SECONDS must be integer seconds" >&2; exit 1 ;;
          esac
          mix test --include soak \
            --timeout "$(((BUNQUEUE_SDK_SOAK_SECONDS + 300) * 1000))" test/soak_test.exs

  sdk-gate:
    name: SDK gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [typescript, python, php, go, rust, elixir]
    if: ${{ always() }}
    steps:
      - name: Require every official SDK
        env:
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          PHP_RESULT: ${{ needs.php.result }}
          GO_RESULT: ${{ needs.go.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          ELIXIR_RESULT: ${{ needs.elixir.result }}
        run: |
          set -euo pipefail
          for result in \
            "$TYPESCRIPT_RESULT" "$PYTHON_RESULT" "$PHP_RESULT" \
            "$GO_RESULT" "$RUST_RESULT" "$ELIXIR_RESULT"; do
            test "$result" = success
          done
